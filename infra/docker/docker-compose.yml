# 本地开发基础设施（PostgreSQL 16 + Redis 7）
#
# 应用服务（gateway / billing / control-api / worker / web）开发期直接
# `bun run dev:*` 或 `go run ./cmd/...` 本地运行，不进 Compose；
# 生产部署镜像见同目录 *.Dockerfile 与 TECHNICAL_SOLUTION 22。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loopz
      POSTGRES_PASSWORD: loopz
      POSTGRES_DB: loopztoken
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopz -d loopztoken"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
